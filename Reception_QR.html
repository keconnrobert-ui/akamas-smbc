<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akamas SMBC — Session QR</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#10233f;font-family:Arial,sans-serif;color:#14243a}.card{width:min(100%,560px);padding:28px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 40px #0005}h1{margin:0 0 8px;color:#1a365d}p{line-height:1.5}.date{font-size:1.1rem;color:#475569}.qr{width:min(72vw,320px);height:auto;padding:8px;border:1px solid #dbe3ec;border-radius:12px}.status{min-height:24px;color:#475569}.hint{padding:12px;background:#ecfdf5;border-radius:10px;color:#166534}.direct{display:inline-block;padding:12px 18px;border-radius:9px;background:#1a365d;color:#fff;text-decoration:none;font-weight:bold}
  </style>
</head>
<body>
  <main class="card">
    <h1>🎳 Akamas SMBC</h1>
    <p>Scan this session QR code with a phone camera to open the check-in demonstration.</p>
    <p class="date">Session date: <strong id="session-date">Loading…</strong></p>
    <img id="session-qr" class="qr" alt="Daily session check-in QR code" hidden>
    <p id="status" class="status" role="status" aria-live="polite">Preparing today’s QR code…</p>
    <a id="direct-link" class="direct" href="#" hidden>Open check-in directly</a>
    <p class="hint">Demonstration: enter any non-empty test identifier to see the welcome screen. No attendance or payment is recorded.</p>
  </main>
  <script>
    google.script.run
      .withSuccessHandler(function(result){
        if(result && result.data && result.data.sessionDate){
          document.getElementById('session-date').textContent=result.data.sessionDate;
          const link=document.getElementById('direct-link');
          link.href=result.data.sessionUrl;link.hidden=false;
        }
        if(!result || !result.ok){
          document.getElementById('status').textContent=(result&&result.message)||'QR code could not be loaded.';
          return;
        }
        const image=document.getElementById('session-qr');
        image.src=result.data.imageDataUrl;image.hidden=false;
        document.getElementById('status').textContent='Ready — scan to open the check-in page.';
      })
      .withFailureHandler(function(error){document.getElementById('status').textContent='Could not load QR: '+error.message;})
      .getQrDemoImageData();
  </script>
</body>
</html>
