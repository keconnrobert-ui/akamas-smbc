<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akamas SMBC — Bowler Check-in</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#1a365d,#0f172a);font-family:Arial,sans-serif;color:#17243a}.card{width:min(100%,440px);padding:26px;background:#fff;border-radius:18px;box-shadow:0 16px 40px #0005}h1{margin:0 0 8px;color:#1a365d;font-size:1.5rem}.date{margin:0 0 22px;color:#64748b}label{display:block;margin-bottom:8px;font-weight:700}input,button{width:100%;min-height:50px;border-radius:9px;font:inherit}input{padding:12px;border:2px solid #cbd5e1}input:focus{outline:3px solid #bfdbfe;border-color:#1a365d}button{margin-top:14px;border:0;background:#1a365d;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{margin-top:16px;padding:14px;border-radius:10px;line-height:1.5}.welcome{background:#ecfdf5;color:#065f46}.caution{background:#fff7ed;color:#9a3412}.error{background:#fef2f2;color:#991b1b}.matches{margin:8px 0 0;padding-left:22px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to Akamas SMBC</h1>
    <p class="date">Session: <strong id="session-date">Loading…</strong></p>
    <form id="checkin-form">
      <label for="identifier">Bowler ID, name, telephone or email</label>
      <input id="identifier" name="identifier" autocomplete="off" placeholder="Enter your details" required maxlength="100">
      <button id="submit" type="submit">Find bowler</button>
    </form>
    <div id="result" class="notice" role="status" aria-live="polite" hidden></div>
  </main>
  <script>
    let sessionDate='';
    const requestedDate=new URLSearchParams(window.location.search).get('sessionDate');
    google.script.run.withSuccessHandler(function(result){
      sessionDate=(requestedDate&&/^\d{4}-\d{2}-\d{2}$/.test(requestedDate))?requestedDate:(result&&result.ok?result.data.sessionDate:'');
      document.getElementById('session-date').textContent=sessionDate||'Unavailable';
    }).getQrDemoSessionInfo();
    document.getElementById('checkin-form').addEventListener('submit',function(event){
      event.preventDefault();
      const button=document.getElementById('submit'), panel=document.getElementById('result');
      button.disabled=true;button.textContent='Searching…';panel.hidden=true;panel.replaceChildren();
      google.script.run.withSuccessHandler(function(result){
        button.disabled=false;button.textContent='Find bowler';panel.hidden=false;
        const data=result&&result.data||{};
        panel.className='notice '+(data.planStatus==='CURRENT'?'welcome':(result&&result.ok?'caution':'error'));
        panel.textContent=(result&&result.message)||'Search could not be completed.';
        if(data.found){
          const detail=document.createElement('div');
          detail.textContent='Bowler: '+(data.name||'')+(data.bowlerId?' ('+data.bowlerId+')':'')+(data.productName?' · Plan: '+data.productName:'')+(data.dueDate?' · Due: '+data.dueDate:'');
          panel.appendChild(document.createElement('br'));panel.appendChild(detail);
        }
        if(data.matches&&data.matches.length){
          const list=document.createElement('ul');list.className='matches';
          data.matches.forEach(function(item){const li=document.createElement('li');li.textContent=item.name+(item.id?' ('+item.id+')':'');list.appendChild(li);});
          panel.appendChild(list);
        }
      }).withFailureHandler(function(error){
        button.disabled=false;button.textContent='Find bowler';panel.hidden=false;panel.className='notice error';panel.textContent='Unable to contact the system: '+error.message;
      }).lookupDemoBowler(document.getElementById('identifier').value,sessionDate);
    });
  </script>
</body>
</html>
